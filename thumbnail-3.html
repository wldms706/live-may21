<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>jjeen eazy - 고정 ③ HOW</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background: #f5f1eb;
            letter-spacing: -0.01em;
        }
        .card {
            width: 1080px;
            height: 1080px;
            background: #f5f1eb;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px 75px;
            position: relative;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            letter-spacing: 8px;
            color: #2c5282;
            text-transform: uppercase;
            font-weight: 700;
            padding-bottom: 25px;
            border-bottom: 1px solid #d8d0c4;
        }
        h2 {
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.03em;
            margin-top: 35px;
        }
        h2 .accent {
            color: #2c5282;
        }
        .subtitle {
            font-size: 1.3rem;
            color: #666;
            margin-top: 12px;
            line-height: 1.6;
        }
        .steps {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-top: 35px;
        }
        .step {
            background: #fff;
            border-radius: 6px;
            padding: 28px 18px;
            text-align: center;
            border: 1px solid #e5dfd2;
        }
        .step .num {
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #2c5282;
            font-weight: 800;
        }
        .step .name {
            font-size: 1.4rem;
            font-weight: 900;
            margin-top: 8px;
            color: #1a1a1a;
        }
        .step .desc {
            font-size: 0.85rem;
            color: #888;
            margin-top: 6px;
            font-weight: 500;
        }
        .arrow {
            text-align: center;
            font-size: 1.8rem;
            color: #2c5282;
            margin: 20px 0;
            font-weight: 900;
        }
        .final {
            background: #1a1a1a;
            color: #fff;
            padding: 26px 30px;
            border-radius: 6px;
            text-align: center;
        }
        .final .label {
            font-size: 0.95rem;
            letter-spacing: 4px;
            color: #5a7ba8;
            font-weight: 700;
        }
        .final .text {
            font-size: 1.8rem;
            font-weight: 900;
            margin-top: 6px;
            letter-spacing: -0.02em;
        }
        .bonus {
            margin-top: 18px;
            text-align: center;
            font-size: 1.15rem;
            color: #2c5282;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .cta {
            margin-top: 22px;
            text-align: center;
            padding: 18px;
            background: #2c5282;
            color: #fff;
            border-radius: 4px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
        }
        .footer {
            font-size: 0.95rem;
            color: #888;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <div class="top-row">
                <span>jjeen eazy</span>
                <span>실행메이킹</span>
            </div>
            <h2>혼자가 아닌 길,<br><span class="accent">12주 시스템</span></h2>
            <p class="subtitle">광고 돌리기 전 반드시 세팅해야 할 3가지</p>

            <div class="steps">
                <div class="step">
                    <div class="num">SETTING 01</div>
                    <div class="name">네이버</div>
                    <div class="desc">플레이스 + 블로그</div>
                </div>
                <div class="step">
                    <div class="num">SETTING 02</div>
                    <div class="name">인스타</div>
                    <div class="desc">피드 + 스토리</div>
                </div>
                <div class="step">
                    <div class="num">SETTING 03</div>
                    <div class="name">랜딩</div>
                    <div class="desc">광고 클릭 받는 곳</div>
                </div>
            </div>
            <div class="arrow">↓</div>
            <div class="final">
                <div class="label">FINAL</div>
                <div class="text">릴스 광고</div>
            </div>
            <div class="bonus">+ 12주 종료 후에도 ∞ 평생 멘토링</div>
            <div class="cta">👉 다음 기수 신청 받는 중</div>
        </div>
        <div class="footer">@jjeen_eazy · 정지은</div>
    </div>
</body>
</html>
