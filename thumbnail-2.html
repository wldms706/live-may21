<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>jjeen eazy - 고정 ② WHY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 1080px;
            height: 1080px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background: #1a1a1a;
            letter-spacing: -0.01em;
        }
        .card {
            width: 1080px;
            height: 1080px;
            background: #1a1a1a;
            color: #f5f1eb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 90px 80px;
            position: relative;
        }
        .brand-row {
            font-size: 1.3rem;
            letter-spacing: 10px;
            color: #2c5282;
            text-transform: uppercase;
            font-weight: 700;
        }
        .marker {
            font-size: 5rem;
            color: #2c5282;
            line-height: 1;
            font-weight: 900;
            font-family: Georgia, serif;
        }
        h2 {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: -0.03em;
            margin-top: 20px;
        }
        h2 .accent {
            color: #5a7ba8;
        }
        .story-block {
            display: flex;
            flex-direction: column;
            gap: 22px;
            margin-top: 50px;
        }
        .story-line {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 1.5rem;
            color: #ccc;
        }
        .story-line .icon {
            color: #2c5282;
            font-size: 1.2rem;
            font-weight: 900;
            min-width: 22px;
        }
        .conclusion {
            margin-top: 50px;
            padding: 30px 35px;
            background: #2c5282;
            color: #fff;
            border-radius: 4px;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.5;
        }
        .footer {
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 3px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <div class="brand-row">jjeen eazy</div>
            <div class="marker" style="margin-top: 28px;">"</div>
            <h2>1년 전 저는,<br><span class="accent">막막했어요</span></h2>
            <div class="story-block">
                <div class="story-line"><span class="icon">━</span>매출은 안 오르고</div>
                <div class="story-line"><span class="icon">━</span>광고만 돌렸고</div>
                <div class="story-line"><span class="icon">━</span>혼자 다 하다 지쳤죠</div>
                <div class="story-line"><span class="icon">━</span>그러다 깨달았어요</div>
            </div>
            <div class="conclusion">
                "사장님은 혼자라서 그래요.<br>그래서 같이 가는 길을 만들었습니다."
            </div>
        </div>
        <div class="footer">@jjeen_eazy · 정지은</div>
    </div>
</body>
</html>
